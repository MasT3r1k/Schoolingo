<div style="height: 100vh;display: flex;align-items: center;justify-content: center;">
    <div class="card">
        <div class="card-header">
            <h2 class="mb">{{ schoolingo.locale.getLocale('toasts/error') }}</h2>
        </div>
        <div class="card-body">
            <p>Omlouváme se za komplikace. Ale nastala nějaká chyba. 😒</p>
            @if (errors[error] != undefined) {
                <ng-component [ngComponentOutlet]="getComponent(error)"></ng-component>
            }
        </div>
    </div>
</div>
