@switch (appState) {
@case (true) {
<!-- Global Seasonal Effects - shows on all pages -->
@if (seasonalService.isActive() && seasonalService.getModeValue() === 'full') {
<!-- Snow Effect (Christmas only) -->
@if (seasonalService.getSeasonValue() === 'christmas') {
<app-snow-effect></app-snow-effect>
}
<!-- Seasonal Decorations (all seasons) -->
<app-seasonal-decorations></app-seasonal-decorations>
}
<router-outlet></router-outlet>
<schoolingo-modals></schoolingo-modals>
<calendar-dropdowns></calendar-dropdowns>
}
@default {
<div class="center" style="height:100vh;width:100vw;">
  <div class="loader bigger"></div>
</div>
}
}
