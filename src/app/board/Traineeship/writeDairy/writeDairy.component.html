@if (traineeship.selectedDay) {
    <div class="card">
        <div class="card-top"></div>
        <div class="card-header mb">
            <div class="left">
                <h2>
                    <a [routerLink]="['', 'traineeship', 'diary']">{{ l.s('sidebar.traineeship.diary') }}</a>
                {{
                    ' / ' +
                    l.s('traineeship.diary.main')
                    + ' / ' +
                    l.s('traineeship.write_diary.main', { day: Utils.formatDateShort(traineeship.selectedDay) })
                }}</h2>
            </div>
        </div>
        <div class="card-body">
        </div>
    </div>
}
