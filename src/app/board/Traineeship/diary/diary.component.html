<div class="card">
    <div class="card-top"></div>
    <div class="card-header mb">
        <h2>{{ schoolingo.locale.getLocale('sidebar/traineeship/diary') }}</h2>
    </div>
    <div class="card-body">
        <schoolingo-datalist (datalist)="receivedDatalist($event)" [options]="{ search: false, hideInfo: true, hidePagination: true }" [head]="['day', 'date', 'traineeship/status/main', 'marks/mark']" [data]="schoolingo.diary"></schoolingo-datalist>

    </div>
</div>
