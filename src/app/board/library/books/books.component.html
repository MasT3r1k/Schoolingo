<div class="card">
    <div class="card-top"></div>
    <div class="card-header mb">
        <h2>{{ schoolingo.locale.getLocale('sidebar/library/books') }}</h2>
    </div>
    <div class="card-body">

        <div class="form-group search mb">
            <input type="text" name="search" [formControl]="search" [placeholder]="schoolingo.locale.getLocale('library/searchBook')">
        </div>

        <schoolingo-datalist [options]="{ url: 'library:getBooks' }" [head]="['library/name', 'library/authors', 'library/ISBN', 'library/genre', 'library/status/main']" [data]="books" [search]="search" [clickFc]="onClick"></schoolingo-datalist>

    </div>
</div>
