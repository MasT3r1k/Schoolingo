<div class="card">
    <div class="card-top"></div>
    <div class="card-header mb">
        <h2>{{ schoolingo.locale.getLocale('sidebar/library/loans') }}</h2>
        <div class="flex-items">
            <schoolingo-tabs [options]="['active', 'all']" [value]="tabValue"></schoolingo-tabs>
        </div>
    </div>
    <div class="card-body">

        <schoolingo-datalist (datalist)="receivedDatalist($event)" [options]="{ search: false, url: 'library:getLoans', ignore: tabValue.getValue() ? [] : ['returned', 'overdue'] }" [head]="['library/name', 'library/authors', 'library/ISBN', 'library/genre', 'library/status/main']" [data]="loans"></schoolingo-datalist>

    </div>
</div>
