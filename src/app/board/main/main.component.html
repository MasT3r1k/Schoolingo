<div class="dashboard">
    <h1>🎓 Můj přehled</h1>
    <div class="modules">
        <div class="module">
            <div class="module-header">
                <h2>{{ l.s("modules.timetable") }}</h2>
                <div class="flex-items">
                    <schoolingo-tabs></schoolingo-tabs>
                </div>
            </div>
            <div class="module-body" [class.skeleton]="timetable() == null">
                <ng-container>
                    <ng-container *ngComponentOutlet="timetable()"></ng-container>
                </ng-container>
            </div>
        </div>

        <div class="module">
            <div class="module-header">
                <h2>{{ l.s("modules.marks") }}</h2>
                <div class="flex-items">
                    <schoolingo-tabs></schoolingo-tabs>
                </div>
            </div>
            <div class="module-body" [class.skeleton]="marks() == null">
                <ng-container>
                    <ng-container *ngComponentOutlet="marks()"></ng-container>
                </ng-container>
            </div>
        </div>

        <div class="module">
            <div class="module-header">
                <h2>{{ l.s("modules.announcements") }}</h2>
                <div class="flex-items">
                    <schoolingo-tabs></schoolingo-tabs>
                </div>
            </div>
            <div class="module-body" [class.skeleton]="announcements() == null">
                <ng-container>
                    <ng-container *ngComponentOutlet="announcements()"></ng-container>
                </ng-container>
            </div>
        </div>

        <div class="module">
            <div class="module-header">
                <h2>{{ l.s("modules.timetable") }}</h2>
                <div class="flex-items">
                    <schoolingo-tabs></schoolingo-tabs>
                </div>
            </div>
            <div class="module-body skeleton"></div>
        </div>
    </div>
</div>
