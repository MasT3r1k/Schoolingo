<main>
    <div class="items">
        @if (getUnexcusedAbsence()) {
            <div class="item red">
                <div class="icon">
                    <i-tabler name="alert-triangle"></i-tabler>
                </div>
                <div class="text">
                    {{ getDescription("unexcusedAbsence") }}                
                </div>
            </div>
        }
        @if (schoolingo.messages.unreadMessage.getValue() > 0) {
            <div class="item blue-info">
                <div class="icon">
                    <i-tabler name="info-circle"></i-tabler>
                </div>
                <div class="text">
                    {{ getDescription("unreadMessages") }}
                </div>
            </div>
        }
        @if (schoolingo.studentService.status) {
            <div class="item blue-info">
                <div class="icon">
                    <i-tabler name="info-circle"></i-tabler>
                </div>
                <div class="text">
                    {{ getDescription("studentService") }}
                </div>
            </div>
        }
    </div>
</main>
