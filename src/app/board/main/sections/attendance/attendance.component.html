<div class="attendance-widget">
    @if (isLoading) {
    <div class="loader">
        <i-tabler name="loader-2"></i-tabler>
    </div>
    } @else {
    <div class="content">
        <!-- Status Card -->
        <div class="status-card">
            @if (isCheckedIn) {
            <div class="status-indicator active">
                <i-tabler name="clock-check"></i-tabler>
            </div>
            <div class="status-info">
                <span class="status-label">Přihlášen</span>
                <span class="status-time">{{ checkInTime }}</span>
            </div>
            } @else {
            <div class="status-indicator inactive">
                <i-tabler name="clock-x"></i-tabler>
            </div>
            <div class="status-info">
                <span class="status-label">Nepřihlášen</span>
            </div>
            }
        </div>

        <!-- Stats Card -->
        <div class="stats-card">
            <div class="stats-icon">
                <i-tabler name="clock-hour-3"></i-tabler>
            </div>
            <div class="stats-info">
                <span class="stats-label">Dnes odpracováno</span>
                <span class="stats-value">{{ formattedTotalWorked }}</span>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        @if (!isCheckedIn) {
        <button class="btn btn--success" (click)="performCheckIn()">
            <i-tabler name="login"></i-tabler>
            Příchod
        </button>
        } @else {
        <button class="btn btn--danger" (click)="performCheckOut()">
            <i-tabler name="logout"></i-tabler>
            Odchod
        </button>
        }
    </div>

    <!-- Footer Link -->
    <a class="footer-link" routerLink="/employees/attendance">
        <i-tabler name="history"></i-tabler>
        <span>Zobrazit minulou docházku</span>
    </a>
    }
</div>
