<div class="marks-container">
    @if (marks.length === 0) {
        <empty-state
            icon="report-analytics"
            title_text="marks.no_marks"
            description_text="marks.no_marks_desc"
        ></empty-state>
    } @else {
    <div class="marks-list">
        @for (mark of marks; track $index) {
        <div class="mark-item" [class.grade-new]="isMarkNew(mark.created)">
            <div>
                <p>{{ mark.subject_name }}</p>
                <p>{{ mark.topic }}</p>
            </div>
            <div class="mark-value">
                {{ formatMark(mark) }}
            </div>

    </div>

</div>
