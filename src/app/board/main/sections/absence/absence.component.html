<div class="absence-widget">
    <div class="attendance-circle">
        <svg class="progress-ring" viewBox="0 0 36 36">
            <path class="circle-bg" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
            <path class="circle-progress" [attr.stroke-dasharray]="attendanceRate + ', 100'" stroke-width="3" stroke-linecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
        </svg>
        <div class="circle-center">
            <span class="circle-percent">{{ attendanceRate }}%</span>
            <span class="circle-label">{{ l.s('absence.attendance_rate') }}</span>
        </div>
    </div>
    <div class="stats-row">
        <div class="stat-col">
            <span class="stat-label">{{ l.s('absence.missed') }}</span>
            <span class="stat-val missed">{{ totalMissedHours }} h</span>
        </div>
        <div class="stat-col">
            <span class="stat-label">{{ l.s('absence.excused') }}</span>
            <span class="stat-val excused">{{ excusedHours }} h</span>
        </div>
        <div class="stat-col">
            <span class="stat-label">{{ l.s('absence.unexcused') }}</span>
            <span class="stat-val unexcused">{{ unexcusedHours }} h</span>
        </div>
    </div>
</div>
