<div class="card">
    <div class="card-top"></div>
    <div class="card-header">
        <h2>{{ schoolingo.locale.getLocale('sidebar/teach/classbook') }}</h2>
        <div class="flex-items">
            <div [ngClass]="{button: true, active: dropdown.isOpen(calendarCalendarName)}" [attr.dropdown]="calendarCalendarName" (click)="$event.stopPropagation();dropdown.toggle(calendarCalendarName)">
                <i-tabler name="calendar-month"></i-tabler>
                {{ selectedDate.getValue().format('DD. MM. YYYY') }}
            </div>
        </div>
    </div>
    <div class="card-body card-row">
        <div class="left hours">
            <div class="hour">

            </div>
        </div>

        <div class="right">
            
        </div>
    </div>
</div>
