<div class="form-group">
    <label for="title">{{ l.s('classbook.add_homework.homework_title') }}</label>
    <input type="text" name="title" id="title">
</div>

<div class="form-group">
    <label for="assignment">{{ l.s('classbook.add_homework.assignment') }}</label>
    <textarea name="assignment" id="assignment"></textarea>
</div>

<div class="form-group">
    <label for="note">{{ l.s('classbook.add_homework.note') }}</label>
    <input type="text">
</div>

<div class="row" style="justify-content: space-between;gap: 16px">
    <div class="form-group" style="width: 100%;">
        <label for="assign_at">{{ l.s('classbook.add_homework.assign_at') }}</label>
        <input type="date">
    </div>

    <div class="form-group" style="width: 100%;">
        <label for="submit_at">{{ l.s('classbook.add_homework.submit_at') }}</label>
        <input type="date">
    </div>
</div>

<div class="form-group">
    <label for="type">{{ l.s('classbook.add_homework.type') }}</label>
    <div class="custom-select" id="homework-type"
        (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = dropdownManager.selected_dropdown == 'homework_type' ? '' : 'homework_type'">
        <div class="selected-value">
            <div class="row" style="gap: .5rem">
                {{ l.s('classbook.add_homework.types.' + type) }}
            </div>
            <i-tabler name="chevron-down"></i-tabler>
        </div>
        @if (dropdownManager.selected_dropdown == 'homework_type') {
        <div class="options-dropdown">
            <div class="list">
                <div class="option row" style="gap: .5rem"
                    (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = ''; type = 'info'">
                    {{ l.s('classbook.add_homework.types.info') }}
                </div>
                <div class="option row" style="gap: .5rem"
                    (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = ''; type = 'submit'">
                    {{ l.s('classbook.add_homework.types.submit') }}
                </div>
            </div>
        </div>
        }
    </div>
</div>

<div class="form-group">
    <div class="btn primary">
        {{ l.s('classbook.add_homework.save_homework') }}
    </div>
</div>
