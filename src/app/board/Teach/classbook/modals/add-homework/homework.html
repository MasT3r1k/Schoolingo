<div class="form-group">
    <label for="title">{{ l.s('classbook.add_homework.homework_title') }}</label>
    <input type="text" name="title" id="title">
</div>

<div class="form-group">
    <label for="assignment">{{ l.s('classbook.add_homework.assignment') }}</label>
    <textarea name="assignment" id="assignment"></textarea>
</div>

<div class="form-group">
    <label for="note">{{ l.s('classbook.add_homework.note') }}</label>
    <input type="text">
</div>

<div class="row" style="justify-content: space-between;gap: 16px">
    <div class="form-group" style="width: 100%;">
        <label for="assign_at">{{ l.s('classbook.add_homework.assign_at') }}</label>
        <input type="date">
    </div>

    <div class="form-group" style="width: 100%;">
        <label for="submit_at">{{ l.s('classbook.add_homework.submit_at') }}</label>
        <input type="date">
    </div>
</div>

<div class="form-group">
    <label for="type">{{ l.s('classbook.add_homework.type') }}</label>
    <select>
        <option value="info">{{ l.s('classbook.add_homework.types.info') }}</option>
        <option value="submit">{{ l.s('classbook.add_homework.types.submit') }}</option>
    </select>
</div>

<div class="form-group">
    <div class="btn primary">
        {{ l.s('classbook.add_homework.save_homework') }}
    </div>
</div>
