<div class="modal-body">
    <div class="form-group">
        <label>Obsah poznámky</label>
        <textarea class="form-control" rows="6" [(ngModel)]="editingNote.content"
            placeholder="Zde napište poznámku..."></textarea>
    </div>
    <div class="form-group row" style="justify-content: space-between;" (click)="editingNote.is_public = !editingNote.is_public">
        Viditelné pro zákonné zástupce
        <schoolingo-checkbox [checked]="editingNote.is_public"></schoolingo-checkbox>
    </div>
</div>
<div class="modal-actions">
    <button class="btn btn--secondary" (click)="closeModal()">{{ l.s('buttons.cancel') }}</button>
    <button class="btn btn--primary" (click)="saveNote()"
        [disabled]="!editingNote.content?.trim()">{{ l.s('buttons.save') }}</button>
</div>
