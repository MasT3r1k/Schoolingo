<form class="reward-form-modal">
    <div class="modal-body">
        <div class="form-section">
            <div class="form-group">
                <label>{{ l.s('students.add_reward.reward_name') }}</label>
                <div class="input-icon-wrap">
                    <i-tabler name="tag"></i-tabler>
                    <input type="text" class="form-input"
                        [placeholder]="l.s('students.add_reward.reward_name_placeholder')"
                        [(ngModel)]="newReward.title" name="title">
                </div>
            </div>

            <div class="form-group">
                <label>{{ l.s('students.add_reward.reward_description') }}</label>
                <textarea class="form-input" rows="3"
                    [placeholder]="l.s('students.add_reward.reward_description_placeholder')"
                    [(ngModel)]="newReward.description" name="description"></textarea>
            </div>
        </div>

        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label>{{ l.s('students.add_reward.reward_type') }}</label>
                    <div class="custom-select" id="new-reward-type"
                        (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = dropdownManager.selected_dropdown == 'new_reward_type' ? '' : 'new_reward_type'">
                        <div class="selected-value">
                            <div class="row" style="gap:.5rem; align-items:center">
                                <i-tabler [name]="selectedTypeIcon()"
                                    style="width:1rem;height:1rem;color:var(--text-muted)"></i-tabler>
                                {{ getTypeLabel(this.newReward.type) }}
                            </div>
                            <i-tabler name="chevron-down"></i-tabler>
                        </div>
                        @if (dropdownManager.selected_dropdown == 'new_reward_type') {
                        <div class="options-dropdown">
                            <div class="list">
                                @for (type of rewardTypes; track type.id) {
                                <div class="option"
                                    (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = ''; newReward.type = type.id">
                                    {{ getTypeLabel(type.id) }}
                                </div>
                                }
                            </div>
                        </div>
                        }
                    </div>
                </div>
                @if (newReward.type === 'financial') {
                <div class="form-group">
                    <label>{{ l.s('students.add_reward.reward_money') }}</label>
                    <div class="input-icon-wrap">
                        <i-tabler name="cash"></i-tabler>
                        <input type="number" class="form-input" placeholder="0" [(ngModel)]="newReward.amount"
                            name="amount">
                    </div>
                </div>
                }
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="modal-actions">
        <button type="button" class="btn btn--ghost" (click)="close()">{{ l.s('buttons.cancel') }}</button>
        <button type="button" class="btn btn--primary" (click)="submit()"
            [disabled]="saving || !newReward.title || !newReward.studentId">
            @if (saving) {
            <div class="loader"></div>
            {{ l.s('buttons.saving') }}
            } @else {
            <i-tabler name="plus"></i-tabler>
            {{ l.s('buttons.add_reward') }}
            }
        </button>
    </div>
</form>
