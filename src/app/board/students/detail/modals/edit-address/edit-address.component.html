<div class="modal-body" (click)="dropdownManager.selected_dropdown = ''">
    <div class="form-grid">
        <div class="form-group">
            <label>Ulice</label>
            <input type="text" class="form-control" [(ngModel)]="form.street" placeholder="Např. Slunná">
        </div>
        <div class="form-group">
            <label>Číslo popisné</label>
            <input type="text" class="form-control" [(ngModel)]="form.houseNumber" placeholder="Např. 123/4">
        </div>
    </div>
    <div class="form-grid">
        <div class="form-group">
            <label>Město</label>
            <input type="text" class="form-control" [(ngModel)]="form.city" placeholder="Např. Praha">
        </div>
        <div class="form-group">
            <label>PSČ</label>
            <input type="text" class="form-control" [(ngModel)]="form.postcode" placeholder="Např. 110 00">
        </div>
    </div>
    <div class="form-group">
        <label>Země</label>

        <schoolingo-dropdown [options]="countries" [(ngModel)]="form.countryId" [settings]="{ locale: false }"></schoolingo-dropdown>
    </div>
</div>

<div class="modal-actions">
    <button class="btn btn--secondary" (click)="closeModal()">
        <i-tabler name="x"></i-tabler>
        <span>Zrušit</span>
    </button>
    <button class="btn btn--primary" (click)="save()">
        <i-tabler name="check"></i-tabler>
        <span>Uložit změny</span>
    </button>
</div>
