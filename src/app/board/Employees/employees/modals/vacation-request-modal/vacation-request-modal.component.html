<div class="modal-body">
    <form class="vacation-form">
        <div class="form-group">
            <label>{{ l.s('employees.request_vacation.types.title') }}</label>
            <div class="custom-select" id="type" (click)="$event.stopPropagation();dropdownManager.selected_dropdown = dropdownManager.selected_dropdown == 'employees_request_vacation_type' ? '' : 'employees_request_vacation_type'">
                <div class="selected-value">
                    <div class="row" style="gap: .5rem">
                        {{ l.s('employees.request_vacation.types.' + selected_type) }}
                    </div>
                    <i-tabler name="chevron-down"></i-tabler>
                </div>
                @if (dropdownManager.selected_dropdown == 'employees_request_vacation_type') {
                <div class="options-dropdown">
                    <div class="list">
                    @for (type of types; track $index) {
                    <div class="option row" style="gap: .5rem" (click)="$event.stopPropagation();dropdownManager.selected_dropdown = '';selected_type = type">
                        {{ l.s('employees.request_vacation.types.' + type) }}
                    </div>
                    }
                    </div>
                </div>
                }
            </div>
        </div>
        <div>
            <div class="form-row">
                <div class="form-group">
                    <label>Od</label>
                    <input type="date" class="form-input">
                </div>
                <div class="form-group">
                    <label>Do</label>
                    <input type="date" class="form-input">
                </div>
            </div>
            <p class="note">Zbývající dovolená: 0 dní</p>
        </div>
        <div class="form-group">
            <label>{{ l.s('employees.request_vacation.reason') }}</label>
            <textarea class="form-textarea" rows="3"></textarea>
        </div>
    </form>
</div>
<div class="modal-actions">
    <button class="btn btn--ghost" (click)="close()">
        {{ l.s('cancel') }}
    </button>
    <button class="btn btn--primary">Odeslat žádost</button>
</div>
