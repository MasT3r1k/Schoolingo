<form class="bonus-form">
    <div class="form-section">
        <h3 class="section-title">Nová prémie</h3>

        <div class="form-group">
            <label>Typ prémie <span class="required">*</span></label>
            <div class="custom-select" id="bonus-type-new"
                (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = dropdownManager.selected_dropdown == 'bonus_type_new' ? '' : 'bonus_type_new'">
                <div class="selected-value">
                    <div class="row" style="gap: .5rem">
                        {{ selectedType() ? selectedType()?.label : newBonus.type }}
                    </div>
                    <i-tabler name="chevron-down"></i-tabler>
                </div>
                @if (dropdownManager.selected_dropdown == 'bonus_type_new') {
                <div class="options-dropdown">
                    <div class="list">
                        @for (type of bonusTypes; track type.value) {
                        <div class="option row" style="gap: .5rem"
                            (click)="$event.stopPropagation(); dropdownManager.selected_dropdown = ''; newBonus.type = type.value">
                            {{ type.label }}
                        </div>
                        }
                    </div>
                </div>
                }
            </div>
        </div>

        <div class="form-group">
            <label>Částka (CZK) <span class="required">*</span></label>
            <input type="number" class="form-input" [(ngModel)]="newBonus.amount" name="amount" placeholder="0" min="0"
                required>
        </div>

        <div class="form-group">
            <label>Datum <span class="required">*</span></label>
            <app-calendar id="bonus_date" [value]="newBonus.date" (valueChange)="newBonus.date = $event"
                size="full"></app-calendar>
        </div>

        <div class="form-group">
            <label>Důvod <span class="required">*</span></label>
            <textarea class="form-textarea" [(ngModel)]="newBonus.reason" name="reason" rows="3"
                placeholder="Popište důvod prémie..." required></textarea>
        </div>
    </div>

    <div class="modal-actions">
        <button type="button" class="btn btn--ghost" (click)="close()">Zrušit</button>
        <button type="button" class="btn btn--primary" (click)="submitNewBonus()"
            [disabled]="!newBonus.amount || !newBonus.reason">
            <i-tabler name="check"></i-tabler>
            Přidat prémii
        </button>
    </div>
</form>
