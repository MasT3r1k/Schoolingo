<form class="bonus-form">
    <div class="form-section">
        <h3 class="section-title">Nová prémie</h3>

        <div class="form-group">
            <label>Typ prémie <span class="required">*</span></label>
            <select class="form-select" [(ngModel)]="newBonus.type" name="type">
                @for (type of bonusTypes; track type.value) {
                <option [value]="type.value">{{ type.label }}</option>
                }
            </select>
        </div>

        <div class="form-group">
            <label>Částka (CZK) <span class="required">*</span></label>
            <input type="number" class="form-input" [(ngModel)]="newBonus.amount" name="amount" placeholder="0" min="0"
                required>
        </div>

        <div class="form-group">
            <label>Datum <span class="required">*</span></label>
            <input type="date" class="form-input" [(ngModel)]="newBonus.date" name="date" required>
        </div>

        <div class="form-group">
            <label>Důvod <span class="required">*</span></label>
            <textarea class="form-textarea" [(ngModel)]="newBonus.reason" name="reason" rows="3"
                placeholder="Popište důvod prémie..." required></textarea>
        </div>
    </div>

    <div class="modal-actions">
        <button type="button" class="btn btn--ghost" (click)="close()">Zrušit</button>
        <button type="button" class="btn btn--primary" (click)="submitNewBonus()"
            [disabled]="!newBonus.amount || !newBonus.reason">
            <i-tabler name="check"></i-tabler>
            Přidat prémii
        </button>
    </div>
</form>
