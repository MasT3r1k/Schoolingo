<div class="items">
    @if (alert != null) {
        <alert [alert]="alert"></alert>
    }

    <div class="item mb">
        <label>
            {{ l.s('roles.student') }}
        </label>
        <div class="value">
            <input type="text" name="name" [value]="marksManager.getSelectedStudent()" readonly="true">
        </div>
    </div>

    <div class="item mb">
        <label>
            {{ l.s('subject') }}
        </label>
        <div class="value">
            <input type="text" name="name" [value]="marksManager.getSubjectName() || this.l.s('unknown')" readonly="true">
        </div>
    </div>

    <div class="item mb">
        <label class="label" [class.error-color]="errors['mark']">
            {{ l.s('marks.mark') }}
            @if (errors['mark']) {
                - {{ errors['mark'] }}
            }
        </label>
        <div class="value">
            <input type="text" name="name" [placeholder]="l.s('marks.mark_placeholder')" [(ngModel)]="mark">
        </div>
        <div class="note">
            {{ l.s('marks.mark_placeholder') }}
        </div>
    </div>

    <div class="form-group">
        <div class="btn" [class.btn--primary]="isButtonActivated()" role="button" (click)="editMark()">
            {{ l.s(`marks.${action == 'edit' ? 'edit_mark' : 'create_mark'}`) }}
        </div>
    </div>
</div>
