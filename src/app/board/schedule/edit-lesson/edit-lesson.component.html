<div class="modal-header">
    <div class="modal-title">{{ l.s('schedule.builder.edit_lesson') }}</div>
    <div class="modal-close" (click)="closeModal()">
        <i-tabler name="x"></i-tabler>
    </div>
</div>
<div class="modal-body">
    <div class="form-group">
        <label>{{ l.s('schedule.builder.subject') }}</label>
        <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedSubjectId">
                @for (subject of scheduleBuilder.subjects; track subject.subjectId) {
                <option [value]="subject.subjectId">{{ subject.subjectName }}</option>
                }
            </select>
            <i-tabler name="chevron-down" class="select-icon"></i-tabler>
        </div>
    </div>

    <div class="form-group">
        <label>{{ l.s('schedule.builder.teacher') }}</label>
        <div class="custom-select-wrapper">
            <select [(ngModel)]="selectedTeacherId">
                @if (selectedSubjectId) {
                @for (teacher of scheduleBuilder.getSubject(selectedSubjectId)?.teachers; track teacher.teacherId) {
                <option [value]="teacher.teacherId">{{ teacher.teacherName }}</option>
                }
                }
            </select>
            <i-tabler name="chevron-down" class="select-icon"></i-tabler>
        </div>
    </div>

    <div class="form-group">
        <label>{{ l.s('schedule.builder.room') }}</label>
        <input type="text" [(ngModel)]="selectedRoom" [placeholder]="l.s('schedule.builder.room_placeholder')">
    </div>

    <div class="form-group">
        <label>{{ l.s('schedule.builder.week') }}</label>
        <div class="week-selector">
            <div class="week-option" [class.active]="selectedWeek === 'both'" (click)="selectedWeek = 'both'">
                {{ l.s('schedule.builder.week_both') }}
            </div>
            <div class="week-option" [class.active]="selectedWeek === 'odd'" (click)="selectedWeek = 'odd'">
                {{ l.s('schedule.builder.week_odd') }}
            </div>
            <div class="week-option" [class.active]="selectedWeek === 'even'" (click)="selectedWeek = 'even'">
                {{ l.s('schedule.builder.week_even') }}
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn primary" (click)="save()">{{ l.s('save') }}</button>
</div>
