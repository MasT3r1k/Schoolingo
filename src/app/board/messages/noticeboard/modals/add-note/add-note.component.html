<div class="form-group">
    <label for="name">{{ l.s('messages.topic') }}</label>
    <input type="text" [(ngModel)]="topic" name="name" id="name">
</div>

<div class="form-group">
    <label for="content">{{ l.s('messages.message') }}</label>
    <textarea name="content" [(ngModel)]="message" id="content"></textarea>
</div>

<div class="modal-actions">
    <div class="btn btn--primary" (click)="new_noticeboard()">
        {{ l.s('messages.write_message_on_noticeboard') }}
    </div>
</div>
