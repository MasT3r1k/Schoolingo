<div class="form-group">
    <label for="name">Titulek zprávy</label>
    <input type="text" [(ngModel)]="topic" name="name" id="name">
</div>

<div class="form-group">
    <label for="content">Zpráva</label>
    <textarea name="content" [(ngModel)]="message" id="content"></textarea>
</div>

<div class="form-group" (click)="new_noticeboard()">
    <div class="btn primary">Vložit zprávu na nástěnku</div>
</div>
