<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
  <div class="card">
    <div class="card-header">
      <h2>Základní nastavení</h2>
    </div>
    <div class="card-body">
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
          <label style="display: flex; justify-content: space-between; align-items: center; font-weight: 500; cursor: pointer;">
            Povolit modul jídelny
            <input type="checkbox" checked style="width: 1.25rem; height: 1.25rem;">
          </label>
        </div>
        
        <div>
          <label style="font-weight: 500; display: block; margin-bottom: 0.5rem;">Uzávěrka objednávek na další týden</label>
          <div style="display:flex; gap: 0.5rem;">
            <select class="input" style="flex: 1;">
              <option>Pátek</option>
              <option>Sobota</option>
              <option selected>Neděle</option>
            </select>
            <input type="time" class="input" value="20:00" style="width: 120px;">
          </div>
          <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem;">Po tomto čase nebude možné měnit objednávky na následující týden.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Propojení s platbami</h2>
    </div>
    <div class="card-body">
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
          <label style="font-weight: 500; display: block; margin-bottom: 0.5rem;">Účet pro strhávání plateb za obědy</label>
          <select class="input" style="width: 100%;">
            <option>Kreditní účet (ID: 1)</option>
            <option>Třídní fond (ID: 2)</option>
          </select>
          <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem;">Studentům bude oběd strháván z tohoto zůstatku. Při nedostatku prostředků nebude možné oběd objednat.</div>
        </div>
        
        <div>
          <label style="display: flex; justify-content: space-between; align-items: center; font-weight: 500; cursor: pointer;">
            Automatická refundace při nemoci
            <input type="checkbox" checked style="width: 1.25rem; height: 1.25rem;">
          </label>
        </div>
      </div>
    </div>
  </div>
</div>

<div>
  <button class="btn btn--primary" (click)="save()">Uložit nastavení</button>
</div>
