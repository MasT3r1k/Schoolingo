<div class="draft-preview-container">
  <div class="draft-card">
    <div class="draft-topic">
      <i-tabler name="calendar-x"></i-tabler>
      {{ mealName || l.s('canteen.assign_meal') }}
    </div>
    <div class="draft-snippet">
      {{ l.s('canteen.remove_assign_warning', { date: formatDate(date), variant: variantIndex }) }}
    </div>
  </div>
</div>

<div class="modal-actions">
  <button class="btn btn--secondary" (click)="closeModal()">
    {{ l.s('buttons.cancel') }}
  </button>
  <button class="btn btn--danger" (click)="confirmRemove()">
    <i-tabler name="calendar-minus"></i-tabler>
    {{ l.s('canteen.remove_assign_btn') }}
  </button>
</div>
