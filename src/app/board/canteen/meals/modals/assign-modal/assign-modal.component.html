<div class="modal-body">
    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;" 
        [innerHTML]="l.s('canteen.assign_hint', { variant: variantIndex, date: formatDate(date) })">
    </div>
    
    <div class="form-group">
    <label class="form-label">{{ l.s('canteen.choose_meal_label') }}</label>
    <schoolingo-dropdown [options]="dropdownOptions" [(ngModel)]="selectedMealId" [settings]="{ locale: false }" style="width: 100%;"></schoolingo-dropdown>
    </div>
</div>

<div class="form-group">
    <label for="limit">Omezení množství</label>
    <input type="text" name="limit" id="limit" [(ngModel)]="limitCount">
    <div class="note">Pro neomezený množství zadejte 0</div>
</div>

<div class="modal-actions">
    <button class="btn btn--secondary" (click)="closeModal()">
    {{ l.s('buttons.cancel') }}
    </button>
    <button class="btn btn--primary" (click)="saveAssign()">
    {{ l.s('canteen.save_assign') }}
    </button>
</div>
