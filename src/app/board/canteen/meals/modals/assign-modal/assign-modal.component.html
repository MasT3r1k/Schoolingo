<div class="modal-body">
    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;" 
        [innerHTML]="l.s('canteen.assign_hint', { variant: variantIndex, date: formatDate(date) })">
    </div>
    
    <div class="form-group">
    <label class="form-label">{{ l.s('canteen.choose_meal_label') }}</label>
    <schoolingo-dropdown [options]="dropdownOptions" [(ngModel)]="selectedMealId" [settings]="{ locale: false }" style="width: 100%;"></schoolingo-dropdown>
    </div>
    <div class="form-group">
        <label for="limit" class="form-label">Omezení množství (porcí)</label>
        <input type="number" class="form-input" name="limit" id="limit" [(ngModel)]="limitCount">
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Pro neomezené množství zadejte 0</div>
    </div>

    @if (users.length > 0) {
        <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Uživatelé, kteří mají toto jídlo zvolené ({{ users.length }}):</label>
            <div style="max-height: 150px; overflow-y: auto; background: var(--surface-2); padding: 0.5rem; border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--border);">
                @for (user of users; track user.user_id) {
                    <div style="padding: 0.25rem 0;">{{ user.first_name }} {{ user.last_name }}</div>
                }
            </div>
            <div style="font-size: 0.8rem; color: var(--warning); margin-top: 0.25rem;">Při změně jídla obdrží všichni tito uživatelé notifikaci do aplikace a upozornění na e-mail.</div>
        </div>
    }
</div>

<div class="modal-actions">
    <button class="btn btn--secondary" (click)="closeModal()">
    {{ l.s('buttons.cancel') }}
    </button>
    <button class="btn btn--primary" (click)="saveAssign()">
    {{ l.s('canteen.save_assign') }}
    </button>
</div>
