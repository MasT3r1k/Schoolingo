<div class="form-grid" [formGroup]="form">
    <div class="form-group">
        <label>
            <i-tabler name="calendar-event"></i-tabler>
            {{ l.s('admin.schoolYears.startDate') }}
        </label>
        <app-calendar id="schoolYear_start" [value]="form.get('start')?.value"
            (valueChange)="form.get('start')?.setValue($event)" size="full"></app-calendar>
    </div>

    <div class="form-group">
        <label>
            <i-tabler name="calendar-check"></i-tabler>
            {{ l.s('admin.schoolYears.endDate') }}
        </label>
        <app-calendar id="schoolYear_end" [value]="form.get('end')?.value"
            (valueChange)="form.get('end')?.setValue($event)" size="full"></app-calendar>
    </div>

    <div class="form-group" style="grid-column: 1 / -1; max-width: 50%;">
        <label>
            <i-tabler name="calendar-stats"></i-tabler>
            {{ l.s('admin.schoolYears.midtermDate') || 'Datum pololetí' }}
        </label>
        <app-calendar id="schoolYear_midterm" [value]="form.get('midterm')?.value"
            (valueChange)="form.get('midterm')?.setValue($event)" size="full"></app-calendar>
    </div>
</div>

<div class="form-group toggle-row" style="margin-top: 1rem;" (click)="current = !current">
    <label class="toggle-label">
        <span class="label-text">
            <i-tabler name="star-filled"></i-tabler>
            {{ l.s('admin.schoolYears.setAsCurrent') }}
        </span>
        <span class="label-description">{{ l.s('admin.schoolYears.setAsCurrentDesc') }}</span>
    </label>
    <schoolingo-checkbox [checked]="current"></schoolingo-checkbox>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn--ghost" (click)="close()">
        {{ l.s('buttons.cancel') }}
    </button>
    <button type="button" class="btn btn--primary" [disabled]="form.invalid" (click)="save()">
        <i-tabler [name]="isEditing ? 'check' : 'plus'"></i-tabler>
        {{ isEditing ? l.s('buttons.save') : l.s('admin.schoolYears.create') }}
    </button>
</div>
