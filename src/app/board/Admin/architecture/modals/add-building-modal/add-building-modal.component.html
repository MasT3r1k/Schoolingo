<div class="modal-body">
    <div class="form-group">
        <label class="form-label">{{ l.s('architecture.building_name') }}</label>
        <input type="text" class="form-input" [(ngModel)]="buildingForm.name" placeholder="Např. Budova A, Hlavní budova...">
    </div>
    <div class="form-group">
        <label class="form-label">{{ l.s('architecture.building_type') }}</label>
        <schoolingo-dropdown [options]="buildingTypes" [(ngModel)]="selected_type"></schoolingo-dropdown>
    </div>
</div>
<div class="modal-actions">
    <button class="btn btn--secondary" (click)="closeModal()">{{ l.s('buttons.cancel') }}</button>
    <button class="btn btn--primary" (click)="saveBuilding()">{{ l.s('buttons.save') }}</button>
</div>
