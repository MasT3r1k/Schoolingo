<div class="card">
    <div class="card-top">
        <!-- <div class="alert error">
            helo
        </div> -->
    </div>
    <div class="card-header">
        <h2>{{ schoolingo.locale.getLocale('settings') }}</h2>
        <div class="flex-items">
            <schoolingo-tabs [value]="selectedTab" [options]="options"></schoolingo-tabs>

        </div>
    </div>
    <div class="card-body card-row">
        <div [ngClass]="{'card-tab': true, active: options.indexOf('changepassword') == selectedTab.getValue()}" id="changepassword">
            <h2 class="small mb">{{ schoolingo.locale.getLocale('changepassword') }}</h2>
            <div class="alert error" style="justify-content: center;">{{ schoolingo.locale.getLocale('changePasswordLogout') }}</div>
            <div class="form">

                <schoolingo-form [inputs]="inputs" [buttons]="buttons" [form]="'changePassword'"></schoolingo-form>

            </div>
        </div>
        <div [ngClass]="{'card-tab': true, active: options.indexOf('language') == selectedTab.getValue()}" id="language">
            <h2 class="small mb">{{ schoolingo.locale.getLocale('languageTitle') }}</h2>
            <div class="form">
            </div>
        </div>
        <div [ngClass]="{'card-tab': true, active: options.indexOf('theme') == selectedTab.getValue()}" id="theme">
            <h2 class="small mb">{{ schoolingo.locale.getLocale('theme') }}</h2>
            <div class="form">

            </div>
        </div>
    </div>

</div>
