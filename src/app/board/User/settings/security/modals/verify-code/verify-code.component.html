<div class="message message--info">
    {{ l.s('settings.2fa.descriptions.' + settings.action) }}
</div>

<form>
    <div class="form-group">
        <label for="token">
            {{ l.s('auth.2fa.authentication_code') }}
        </label>
        <input type="text" [placeholder]="l.s('auth.2fa.authentication_code')" id="token" autocomplete="off"
            [minlength]="AuthConfig.token_length" [maxlength]="AuthConfig.token_length"
            [formControl]="settings.TFAControl">
    </div>
    <div class="modal-actions">
        <div class="btn" (click)="closeModal()">
            {{ l.s('buttons.close') }}
        </div>
        <div class="btn" [class.btn--primary]="settings.checkValidTFA()" [class.disabled]="!settings.checkValidTFA()"
            (click)="runAction2FA()">
            @if (active_action == 'activating_2fa') {
            <div class="loader"></div>
            <span>{{ l.s('auth.2fa.verify_code_action') }}</span>
            } @else {
            <i-tabler name="shield-check"></i-tabler>
            <span>{{ l.s('auth.2fa.verify_code') }}</span>
            }
        </div>
    </div>
</form>
