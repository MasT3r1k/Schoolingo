<div class="message info">
    {{ l.s('settings.2fa.descriptions.add_to_phone') }}
</div>

<div class="center">
    @if (qrcode == '') {
        <div class="loader" style="width: 180px;height:180px"></div>
    } @else {
        <qrcode
        [allowEmptyString]="false"
        [width]="225"
        [margin]="0"
        [elementType]="'canvas'"
        [errorCorrectionLevel]="'M'"
        [title]="'2FA Schoolingo'"
        [imageSrc]="'./assets/logo.webp'"
        [imageHeight]="56"
        [imageWidth]="56"
        [colorDark]="t.getThemeColor() == 'dark' ? '#FFFFFF' : '#000000'"
        [colorLight]="t.getThemeColor() == 'light' ? '#FFFFFF' : '#000000'"
        [qrdata]="qrcode"
        ></qrcode>
    }
</div>

<form>
    <div class="form-group">
        <label for="token" [class.error-color]="errors['token'] !== undefined">
            {{ l.s('auth.2fa.authentication_code') }}
            @if (errors['token'] !== undefined) {
                <span class="label-error">
                    - {{ errors['token'] }}
                </span>
            }
        </label>
        <input type="text" [placeholder]="l.s('auth.2fa.authentication_code')" id="token" autocomplete="off" [minlength]="AuthConfig.token_length"  [maxlength]="AuthConfig.token_length" [formControl]="settings.TFAControl">
    </div>
    <div class="form-group">
        <div class="btn" [class.primary]="settings.checkValidTFA()" [class.disabled]="!settings.checkValidTFA()" (click)="verifyActivation2FA()">
            @if (active_action == 'activating_2fa') {
                <div class="loader"></div>
                <span>{{ l.s('auth.2fa.verify_code_action') }}</span>
            } @else {
                {{ l.s('auth.2fa.verify_code') }}
            }
        </div>
    </div>

    <div class="form-group">
        <div class="btn" (click)="closeModal()">
            {{ l.s('close') }}
        </div>
    </div>
</form>
