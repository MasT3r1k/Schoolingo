<div class="select select-row">
    @for(theme of schoolingo.theme.getThemes();track $index) {
        <div [ngClass]="{'select-option': true, active: schoolingo.theme.getTheme() == theme}" (click)="selectTheme(theme);">
            <div class="left">
                <div class="column">
                    <div class="preview">
                        <div [ngClass]="['wrapper', (theme == 'system') ? (schoolingo.theme.getSystemColor() == 'dark') ? 'dark' : 'light' : theme]">
                            <div class="header" style="height: 48px"></div>
                            <div class="content">
                                <div class="sidebar active" style="height: 100vh;width: 100px"></div>
                                <div class="main-content">
                                    <div class="box">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bottom">
                        {{ locale.getLocale("themes/" + theme) }}
                    </div>
                </div>
            </div>
        </div>
    }
</div>
