<div class="template-grid">
    @for (template of templates; track template.type) {
        <div class="template-card" (click)="selectReport(template.type)">
            <div class="template-icon" [class]="template.color">
                <i-tabler [name]="template.icon"></i-tabler>
            </div>
            <div class="template-text">
                <h4>{{ l.s('reports.types.' + template.type) }}</h4>
                <p>{{ l.s('reports.types.' + template.type + '_desc') }}</p>
            </div>
        </div>
    }
</div>

<div class="modal-footer mt-5">
    <button class="btn btn--secondary" (click)="closeModal()">{{ l.s('buttons.close') }}</button>
</div>
