<div class="form-body">
    <div class="form-group">
        <label>{{ l.s('fleetvehicles.vehicle') }} *</label>
        <select [(ngModel)]="newReservation.vehicleId" required>
            <option value="0" disabled>{{ l.s('fleetvehicles.select_vehicle') }}</option>
            @for (vehicle of vehicles; track vehicle.vehicleId) {
            @if (vehicle.status === 'available') {
            <option [ngValue]="vehicle.vehicleId">{{ vehicle.name }} ({{ vehicle.licensePlate }})</option>
            }
            }
        </select>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>{{ l.s('fleetvehicles.start_date') }} *</label>
            <input type="date" [(ngModel)]="newReservation.startDate" required />
        </div>
        <div class="form-group">
            <label>{{ l.s('fleetvehicles.end_date') }} *</label>
            <input type="date" [(ngModel)]="newReservation.endDate" required />
        </div>
    </div>
    <div class="form-group">
        <label>{{ l.s('fleetvehicles.purpose') }} *</label>
        <input type="text" [(ngModel)]="newReservation.purpose" [placeholder]="l.s('fleetvehicles.purpose_placeholder')" required />
    </div>
    <div class="form-group">
        <label>{{ l.s('fleetvehicles.destination') }}</label>
        <input type="text" [(ngModel)]="newReservation.destination"
            [placeholder]="l.s('fleetvehicles.destination_placeholder')" />
    </div>
    <div class="form-group">
        <label>{{ l.s('fleetvehicles.notes') }}</label>
        <textarea [(ngModel)]="newReservation.notes" rows="3"
            [placeholder]="l.s('fleetvehicles.notes_placeholder')"></textarea>
    </div>
</div>
<div class="form-footer">
    <button class="btn btn--ghost" (click)="closeNewReservationForm()">
        {{ l.s('buttons.cancel') }}
    </button>
    <button class="btn btn--primary" (click)="submitReservation()">
        <i-tabler name="calendar-plus"></i-tabler>
        {{ l.s('fleetvehicles.create_reservation') }}
    </button>
</div>
