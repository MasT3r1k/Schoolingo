<div class="tabs" [attr.theme]="theme" [class.no-bottom-border]="no_bottom_radius" [id]="name">
    @for (option of options; track $index) {
        <div class="tab" [class.active]="value.getValue() == $index" [style.width]="getWidth()" (click)="value.next($index)">
            @if(icons[$index] && icons[$index] != null) {
                <i-tabler [name]="icons[$index]!"></i-tabler>
            }
            {{ l.s(`${prefix}${option}`) }}
        </div>
    }
</div>
