<div class="calendar-wrap" id="calWrap">
    <div
        class="calendar-input input"
        [class.focus]="calendarManager.isVisibleCalendar('interm-record')"
        id="calToggle"
        role="button"
        aria-haspopup="true"
        aria-expanded="false"
        (click)="calendarManager.isVisibleCalendar('interm-record') ? calendarManager.closeCalendar('interm-record') : calendarManager.showCalendar('interm-record')"
    >
        <div class="label">
            {{ l.s('calendar.date') }}
        </div>
        <div class="value" id="calValue">
            @if (this.calendarManager.getCalendarData("interm-record")) {
                
            }
            {{ l.s('calendar.placeholder') }}
        </div>
        <div class="chev">
            <i-tabler name="chevron-down"></i-tabler>
        </div>
    </div>
</div>
