<div class="alerts">
@if (alert.visible) {
    <div class="alert" [class.alert--success]="alert.type == 'success'" [class.alert--danger]="alert.type == 'error'" [class.alert--primary]="alert.type == 'info'">
        <div class="text" [style.width]="!alert.actions.length ? '100%' : ''">
            {{ l.s(alert.text) }}
        </div>
        @if (alert.actions.length) {
            <div class="actions">
                @for (btn of alert.actions;track $index) {
                    <div class="btn" (click)="btn.action()">
                        {{ l.s(btn.text) }}
                    </div>
                }
            </div>
        }
        @if (alert._closeable) {
            <div class="close" (click)="alert.close()">
                <i-tabler name="x"></i-tabler>
            </div>
        }
    </div>
}
</div>
