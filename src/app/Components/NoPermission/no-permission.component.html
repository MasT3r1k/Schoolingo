<div class="no-permission-overlay">
  <div class="no-permission-container">
    <div class="no-permission-icon">
      <div class="icon-blob"></div>
      <i-tabler [name]="icon"></i-tabler>
    </div>
    <div class="no-permission-content">
      <h2>{{ l.s(title) }}</h2>
      <p>{{ l.s(description) }}</p>
    </div>
    <div class="no-permission-actions">
      <button class="btn btn--primary" (click)="goBack()">
        <i-tabler name="arrow-left"></i-tabler>
        <span>{{ l.s(backButtonText) }}</span>
      </button>
    </div>
  </div>
</div>
